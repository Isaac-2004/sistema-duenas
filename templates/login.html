<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — {{ nombre_empresa }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🥦</div>
      <h1 class="text-2xl font-bold text-white">{{ nombre_empresa }}</h1>
      <p class="text-gray-400 text-sm mt-1">Sistema de Gestión</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
          ❌ {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Usuario</label>
          <input id="username" name="username" type="text" required autofocus
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                 placeholder="admin">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Contraseña</label>
          <input id="password" name="password" type="password" required
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                 placeholder="••••••••">
        </div>
        <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
          Entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
