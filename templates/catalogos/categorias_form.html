{% extends 'base.html' %}
{% block title %}{{ 'Nueva' if not categoria else 'Editar' }} Categoría{% endblock %}
{% block content %}
<div class="flex items-center gap-2 mb-5">
  <a href="{{ url_for('catalogos.categorias_lista') }}" class="text-gray-500 hover:text-gray-700 text-sm">← Categorías</a>
</div>
<form method="POST" class="max-w-md">
  <div class="bg-white rounded-xl shadow-sm p-5 space-y-4 mb-4">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Nombre *</label>
      <input name="nombre" required value="{{ categoria.nombre if categoria else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Descripción</label>
      <input name="descripcion" value="{{ categoria.descripcion if categoria else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    {% if categoria %}
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Estado</label>
      <select name="estado" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        <option value="1" {{ 'selected' if categoria.estado }}>Activo</option>
        <option value="0" {{ 'selected' if not categoria.estado }}>Inactivo</option>
      </select>
    </div>
    {% endif %}
  </div>
  <div class="flex gap-3">
    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm">Guardar</button>
    <a href="{{ url_for('catalogos.categorias_lista') }}" class="bg-gray-200 text-gray-700 px-6 py-2.5 rounded-lg text-sm">Cancelar</a>
  </div>
</form>
{% endblock %}
