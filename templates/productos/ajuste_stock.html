{% extends 'base.html' %}
{% block title %}Ajustar Stock — {{ producto.nombre }}{% endblock %}
{% block content %}
<div class="flex items-center gap-2 mb-5">
  <a href="{{ url_for('productos.lista') }}" class="text-gray-500 hover:text-gray-700 text-sm">← Productos</a>
  <span class="text-gray-300">/</span>
  <h2 class="text-xl font-bold text-gray-800">Ajustar Stock</h2>
</div>

<div class="max-w-md">
  <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-5">
    <p class="font-semibold text-gray-800">{{ producto.nombre }}</p>
    <p class="text-sm text-gray-600 mt-1">Stock actual: <span class="font-bold text-blue-700">{{ producto.stock_actual }}</span></p>
    <p class="text-sm text-gray-600">Stock mínimo: {{ producto.stock_minimo }}</p>
  </div>

  <form method="POST" class="bg-white rounded-xl shadow-sm p-5 space-y-4">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Tipo de ajuste</label>
      <select name="tipo" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        <option value="AJUSTE_POSITIVO">➕ Aumentar stock (entrada manual)</option>
        <option value="AJUSTE_NEGATIVO">➖ Reducir stock (merma / error)</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Cantidad a ajustar *</label>
      <input name="cantidad" type="number" step="0.001" min="0.001" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
             placeholder="0.000">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Motivo del ajuste</label>
      <input name="notas"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
             placeholder="Ej: conteo físico, merma, error anterior…">
    </div>
    <div class="flex gap-3">
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm">Aplicar Ajuste</button>
      <a href="{{ url_for('productos.lista') }}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2.5 rounded-lg text-sm">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
