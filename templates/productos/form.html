{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="flex items-center gap-2 mb-5">
  <a href="{{ url_for('productos.lista') }}" class="text-gray-500 hover:text-gray-700 text-sm">← Productos</a>
  <span class="text-gray-300">/</span>
  <h2 class="text-xl font-bold text-gray-800">{{ titulo }}</h2>
</div>

<form method="POST" class="max-w-2xl">
  <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Código *</label>
        <input name="codigo" required value="{{ producto.codigo if producto else '' }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Estado</label>
        <select name="estado" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="1" {{ 'selected' if not producto or producto.estado }}>Activo</option>
          <option value="0" {{ 'selected' if producto and not producto.estado }}>Inactivo</option>
        </select>
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-medium text-gray-600 mb-1">Nombre *</label>
        <input name="nombre" required value="{{ producto.nombre if producto else '' }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Categoría *</label>
        <select name="id_categoria" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          {% for cat in categorias %}
            <option value="{{ cat.id_categoria }}" {{ 'selected' if producto and producto.id_categoria==cat.id_categoria }}>{{ cat.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Unidad *</label>
        <select name="id_unidad" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          {% for u in unidades %}
            <option value="{{ u.id_unidad }}" {{ 'selected' if producto and producto.id_unidad==u.id_unidad }}>{{ u.nombre }} ({{ u.abreviatura }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Precio de Compra ($)</label>
        <input name="precio_compra" type="number" step="0.01" min="0"
               value="{{ producto.precio_compra if producto else '0' }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Precio de Venta ($) *</label>
        <input name="precio_venta" type="number" step="0.01" min="0" required
               value="{{ producto.precio_venta if producto else '0' }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Stock Mínimo</label>
        <input name="stock_minimo" type="number" step="0.001" min="0"
               value="{{ producto.stock_minimo if producto else '0' }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input name="aplica_iva" type="checkbox" value="1"
                 {{ 'checked' if producto and producto.aplica_iva }}
                 class="w-4 h-4 rounded border-gray-300 text-green-600">
          <span class="text-gray-700">Aplica IVA ({{ (iva_rate * 100)|int }}%)</span>
        </label>
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-medium text-gray-600 mb-1">Descripción</label>
        <textarea name="descripcion" rows="2"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">{{ producto.descripcion if producto else '' }}</textarea>
      </div>
    </div>
  </div>
  <div class="flex gap-3">
    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm">Guardar</button>
    <a href="{{ url_for('productos.lista') }}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2.5 rounded-lg text-sm">Cancelar</a>
  </div>
</form>
{% endblock %}
